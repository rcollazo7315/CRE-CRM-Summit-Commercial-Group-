<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summit Commercial Group | Deal Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      window.process = { env: { NODE_ENV: 'production' } };
      
      window.onerror = function(msg, url, line, col, error) {
        console.error('Global Error:', { msg, url, line, col, error });
        const root = document.getElementById('root');
        if (root && (root.innerHTML.includes('Initialising') || root.innerHTML === '')) {
          root.innerHTML = `
            <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:white;font-family:Inter,sans-serif;padding:20px;text-align:center;">
              <h2 style="margin-bottom:16px;font-weight:700;color:#ef4444;">⚠️ Application Load Failure</h2>
              <p style="color:#94a3b8;margin-bottom:24px;max-width:400px;">${msg}</p>
              <button onclick="window.location.reload()" style="background:#10b981;color:white;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:600;">
                Retry Portal
              </button>
            </div>`;
        }
        return false;
      };
      
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              summit: {
                900: '#0f172a',
                800: '#1e293b',
                700: '#334155',
                accent: '#10b981',
              }
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.2.0,react-dom@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
    "firebase/app": "https://esm.sh/firebase@10.8.0/app",
    "firebase/auth": "https://esm.sh/firebase@10.8.0/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.8.0/firestore",
    "firebase/storage": "https://esm.sh/firebase@10.8.0/storage",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.2",
    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>
  </head>
  <body class="bg-slate-50 antialiased">
    <div id="root">
      <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:white;font-family:Inter,sans-serif;">
        <div style="font-weight:800;font-size:32px;letter-spacing:-0.025em;margin-bottom:24px;">Summit<span style="font-weight:300;color:#10b981;">CG</span></div>
        <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#10b981;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <p style="margin-top:16px;font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:#94a3b8;">Initialising Agent Portal</p>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
