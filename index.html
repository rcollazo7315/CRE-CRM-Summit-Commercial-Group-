<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summit Commercial Group | Deal Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      window.process = { env: { NODE_ENV: 'production' } };
      
      function showGlobalError(title, details) {
        const root = document.getElementById('root');
        if (root) {
           // Only take over if we are still initializing
           if (root.innerText.includes('Initialising') || root.innerHTML.includes('spin') || root.innerHTML === '') {
             root.innerHTML = `
              <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:white;font-family:Inter,sans-serif;padding:24px;">
                <div style="background:#1e293b;border:1px solid #ef4444;border-radius:16px;padding:32px;max-width:600px;width:100%;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
                  <h2 style="color:#ef4444;margin:0 0 16px 0;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;">
                    <span style="font-size:24px">⚠️</span> Application Error
                  </h2>
                  <p style="color:#94a3b8;margin-bottom:20px;line-height:1.5;">${title}</p>
                  <pre style="background:#0f172a;padding:16px;border-radius:8px;color:#f87171;font-size:12px;overflow-x:auto;white-space:pre-wrap;margin-bottom:24px;border:1px solid #334155;">${details}</pre>
                  <button onclick="window.location.reload()" style="background:#fff;color:#0f172a;border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;transition:transform 0.1s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                    Reload Application
                  </button>
                </div>
              </div>
             `;
           }
        }
        console.error(title, details);
      }

      window.onerror = function(msg, url, line, col, error) {
        const errorDetails = error ? (error.stack || error.message) : `${msg}\nAt: ${url}:${line}:${col}`;
        showGlobalError('Runtime Exception', errorDetails);
        return false;
      };

      window.addEventListener('unhandledrejection', function(event) {
        const reason = event.reason;
        const details = reason instanceof Error ? reason.stack : JSON.stringify(reason);
        showGlobalError('Unhandled Promise Rejection', details);
      });
      
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              summit: {
                900: '#0f172a',
                800: '#1e293b',
                700: '#334155',
                accent: '#10b981',
              }
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.2.0,react-dom@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
    "firebase/app": "https://esm.sh/firebase@10.13.1/app",
    "firebase/auth": "https://esm.sh/firebase@10.13.1/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.13.1/firestore",
    "firebase/storage": "https://esm.sh/firebase@10.13.1/storage",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.2?deps=jspdf@2.5.1",
    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>
  </head>
  <body class="bg-slate-50 antialiased">
    <div id="root">
      <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:white;font-family:Inter,sans-serif;">
        <div style="font-weight:900;font-size:40px;letter-spacing:-0.05em;margin-bottom:24px;">Summit<span style="font-weight:300;color:#10b981;">CG</span></div>
        <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#10b981;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <p style="margin-top:24px;font-size:12px;text-transform:uppercase;letter-spacing:0.2em;color:#94a3b8;font-weight:700;">Initialising Secure Agent Portal</p>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
